<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حداد الرياض</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:#000;color:#fff;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:min(1440px,100% - 48px);margin:0 auto}

/* header */
header{position:fixed;top:0;left:0;width:100vw;height:80px;z-index:10;background:transparent;transition:.3s}
header.sc{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.1)}
.hb{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo img{width:auto;height:50px}
nav ul{display:flex;gap:32px;list-style:none}
nav a{font-weight:700;font-size:17px;color:#fff;transition:.2s}
nav a:hover{opacity:.7}
header.sc nav a{color:#111}
.cta{padding:10px 24px;border-radius:8px;background:#fff;color:#111;font-weight:800}
header.sc .cta{background:#111;color:#fff}

/* hero */
.hero{position:relative;height:100vh;min-height:600px;display:flex;align-items:center;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.slide.on{opacity:1}
.slide::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.txt{position:relative;z-index:2}
.txt h1{font-size:clamp(38px,5.5vw,76px);font-weight:800;line-height:1.2;margin-bottom:16px}
.txt p{font-size:clamp(14px,1.6vw,20px);font-weight:700;color:#fff;white-space:nowrap;margin-bottom:32px}
.btn{display:inline-block;padding:14px 32px;border-radius:8px;background:#fff;color:#111;font-weight:800}

/* arrows */
.nv{position:absolute;top:50%;z-index:3;width:54px;height:54px;margin-top:-27px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.6);transition:.2s}
.nv:hover{background:#fff;color:#111}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#nx{left:24px}#pv{right:24px}

/* pagination */
#pg{position:absolute;z-index:3;bottom:32px;left:0;right:0;display:flex;justify-content:center;gap:10px}
#pg button{width:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.4);transition:.3s}
#pg button.on{width:34px;background:#fff}

@media(max-width:800px){nav,.cta{display:none}.nv{width:40px;height:40px;margin-top:-20px}#nx{left:10px}#pv{right:10px}.txt p{font-size:clamp(11px,3.2vw,15px)}}
</style>
</head>
<body>

<header>
  <div class="wrap hb">
    <a class="logo" href="/"><img src="/assets/logo.png" alt="حداد الرياض"></a>
    <nav>
      <ul>
        <li><a href="/">الرئيسية</a></li>
        <li><a href="/services/">خدماتنا</a></li>
        <li><a href="/projects/">معرض الأعمال</a></li>
        <li><a href="/blog/">المدونة</a></li>
        <li><a href="/contact/">تواصل معنا</a></li>
      </ul>
    </nav>
    <a class="cta" href="tel:0534107471">اتصل بنا</a>
  </div>
</header>

<section class="hero">
  <div id="slides"></div>
  <div class="wrap"><div class="txt" id="txt"></div></div>
  <button class="nv" id="pv" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="nv" id="nx" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="pg"></div>
</section>

<script>
const IMG="/assets/hero-1.jpeg"; // صورة تجريبية واحدة
const S=[
 {t:"أعمال الحدادة باحترافية",p:"هياكل حديدية وأبواب وبوابات بتشطيبات تناسب كل مشروع"},
 {t:"مظلات سيارات متينة",p:"مظلات للمواقف والمساحات الخارجية بهياكل قوية"},
 {t:"سواتر وزجاج سيكوريت",p:"خصوصية وحماية بمقاسات دقيقة وتركيب آمن"}
];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let i=0,timer;

$("#slides").innerHTML=S.map(()=>`<div class="slide"><img src="${IMG}" alt=""></div>`).join("");
$("#pg").innerHTML=S.map((_,k)=>`<button data-i="${k}" aria-label="${k+1}"></button>`).join("");

function go(n){
  i=(n+S.length)%S.length;
  $$(".slide").forEach((s,k)=>s.classList.toggle("on",k===i));
  $$("#pg button").forEach((b,k)=>b.classList.toggle("on",k===i));
  $("#txt").innerHTML=`<h1>${S[i].t}</h1><p>${S[i].p}</p><a class="btn" href="#contact">اطلب عرض سعر</a>`;
  clearInterval(timer);timer=setInterval(()=>go(i+1),6000);
}
$("#nx").onclick=()=>go(i+1);
$("#pv").onclick=()=>go(i-1);
$("#pg").onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
go(0);

const hd=$("header");
const sc=()=>hd.classList.toggle("sc",scrollY>40);
sc();addEventListener("scroll",sc,{passive:true});
</script>
</body>
</html>
