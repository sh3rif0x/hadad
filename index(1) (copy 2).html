<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حداد الرياض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--dk:#0B2530;--bl:#176d91;--bld:#0E4A63;--gd:#C9A86A;--ac:#E0C48C}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:#000;color:#fff;line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.wrap{width:min(1440px,100% - 48px);margin:0 auto}

/* header: full 100vw, top:0, transparent → colored on scroll */
header{position:fixed;top:0;left:0;right:0;width:100vw;height:84px;z-index:100;background:transparent;transition:background .35s,box-shadow .35s,height .35s,backdrop-filter .35s}
header.sc{height:72px;background:linear-gradient(135deg,rgba(11,37,48,.97),rgba(14,74,99,.97));box-shadow:0 10px 32px rgba(0,0,0,.35);backdrop-filter:blur(12px);border-bottom:1px solid rgba(224,196,140,.35)}
.hb{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo img{width:auto;height:54px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
nav ul{display:flex;gap:34px;list-style:none;align-items:center}
nav a,.dd-t{position:relative;display:flex;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:18px;transition:.2s;text-shadow:0 1px 8px rgba(0,0,0,.45)}
nav a:hover,.dd-t:hover{color:var(--ac)}
.dd{position:relative;padding:14px 0}
.dd-m{position:absolute;top:100%;right:50%;width:250px;padding:10px;background:linear-gradient(160deg,#0F3242,#0B2530);border:1px solid rgba(224,196,140,.3);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:translateX(50%) translateY(10px);transition:.2s}
.dd:hover .dd-m,.dd.open .dd-m{opacity:1;visibility:visible;transform:translateX(50%)}
.dd-m a{color:rgba(255,255,255,.88)!important;text-shadow:none;font-size:16px;padding:9px 14px;border-radius:9px}
.dd-m a:hover{background:rgba(224,196,140,.12);color:var(--ac)!important}
.cta{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:10px;background:#fff;color:var(--dk);font-weight:800;transition:.25s}
.cta:hover{transform:translateY(-2px)}
header.sc .cta{background:linear-gradient(135deg,#E6CD98,#C9A86A 55%,#A98544)}
.burger{display:none;width:44px;height:44px;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.burger i{width:26px;height:3px;border-radius:9px;background:#fff}

/* hero */
.hero{position:relative;width:100%;height:100vh;min-height:620px;display:flex;align-items:center;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s}
.slide.on{opacity:1}
.slide img{transform:scale(1.02);transition:transform 7s ease-out}
.slide.on img{transform:scale(1.08)}
/* simple black overlay on edges only */
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.7) 0,rgba(0,0,0,0) 22%),
    linear-gradient(to top,rgba(0,0,0,.75) 0,rgba(0,0,0,0) 26%),
    linear-gradient(to right,rgba(0,0,0,.6) 0,rgba(0,0,0,0) 20%),
    linear-gradient(to left,rgba(0,0,0,.6) 0,rgba(0,0,0,0) 20%)}
.hero .wrap{position:relative;z-index:2}
#hc{max-width:100%;padding:130px 0}
#hc.in{animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#hc .lbl{color:var(--ac);font-weight:800;font-size:16px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#hc h1{font-size:clamp(40px,6vw,80px);line-height:1.1;font-weight:800;margin:12px 0 20px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#hc h1 b{display:block;color:var(--ac)}
#hc p{font-size:clamp(14px,1.7vw,22px);font-weight:800;color:#fff;white-space:nowrap;margin-bottom:32px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border-radius:12px;font-weight:800;transition:.25s}
.btn:hover{transform:translateY(-2px)}
.b-p{background:linear-gradient(135deg,#E6CD98,#C9A86A 55%,#A98544);color:var(--dk)}
.b-g{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.65)}
.b-g:hover{background:#fff;color:var(--dk)}
.hn{position:absolute;z-index:3;inset:auto 0 32px}
.hn .wrap{display:flex;align-items:center;gap:16px;color:var(--ac);font-weight:800}
#tl{display:flex;gap:6px;flex:1;max-width:380px}
#tl span{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.35);cursor:pointer;position:relative;overflow:hidden}
#tl span::after{content:"";position:absolute;inset:0;background:var(--ac);transform:scaleX(0);transform-origin:right}
#tl span.on::after{transform:scaleX(1);transition:transform 6s linear}

@media(max-width:900px){
.burger{display:flex}.cta{display:none}
nav{position:absolute;top:100%;inset-inline:16px;display:none;padding:10px;background:linear-gradient(160deg,#0F3242,#0B2530);border:1px solid rgba(224,196,140,.3);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
nav.open{display:block}
nav ul{flex-direction:column;align-items:stretch;gap:0}
nav a,.dd-t{padding:13px 14px;width:100%;justify-content:space-between}
.dd{padding:0}
.dd-m{position:static;width:100%;box-shadow:none;border:0;background:rgba(255,255,255,.05);display:none;opacity:1;visibility:visible;transform:none}
.dd.open .dd-m{display:block;transform:none}}
@media(max-width:650px){#hc h1{font-size:40px}#hc p{font-size:clamp(11px,3.3vw,16px)}#hc .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hb">
    <a class="logo" href="/" aria-label="حداد الرياض"><img src="/assets/logo.png" alt="حداد الرياض"></a>
    <nav aria-label="القائمة الرئيسية">
      <ul>
        <li><a href="/">الرئيسية</a></li>
        <li class="dd">
          <button class="dd-t" type="button" aria-haspopup="true">خدماتنا <span>⌄</span></button>
          <div class="dd-m">
            <a href="/services/iron-works/">أعمال الحدادة</a>
            <a href="/services/car-shades/">مظلات السيارات</a>
            <a href="/services/screens/">السواتر</a>
            <a href="/services/sandwich-panel/">ساندوتش بانل</a>
            <a href="/services/sandwich-rooms/">غرف ساندوتش بانل</a>
            <a href="/services/tempered-glass/">الزجاج السيكوريت</a>
            <a href="/services/facades/">الواجهات</a>
            <a href="/services/"><b>جميع الخدمات</b></a>
          </div>
        </li>
        <li><a href="/projects/">معرض الأعمال</a></li>
        <li><a href="/blog/">المدونة</a></li>
        <li><a href="/contact/">تواصل معنا</a></li>
      </ul>
    </nav>
    <a class="cta" href="tel:0534107471">اتصل بنا</a>
    <button class="burger" type="button" aria-label="فتح القائمة"><i></i><i></i><i></i></button>
  </div>
</header>

<main>
<section class="hero" id="home">
  <div id="slides"></div>
  <div class="wrap"><div id="hc"></div></div>
  <div class="hn"><div class="wrap"><span id="cnt">01</span><div id="tl"></div><span>05</span></div></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* header */
const hd=$("header"),nav=$("nav"),dd=$(".dd");
const sc=()=>hd.classList.toggle("sc",scrollY>40);
sc();addEventListener("scroll",sc,{passive:true});
$(".burger").onclick=()=>nav.classList.toggle("open");
$(".dd-t").onclick=e=>{e.stopPropagation();dd.classList.toggle("open")};
document.addEventListener("click",e=>{if(!e.target.closest(".dd"))dd.classList.remove("open")});
$$("nav a").forEach(a=>a.addEventListener("click",()=>nav.classList.remove("open")));

/* hero slider */
const H=[
{i:"hero-1.jpeg",e:"حداد الرياض",a:"أعمال الحدادة",b:"باحترافية",p:"هياكل حديدية وأبواب وبوابات بتشطيبات تناسب كل مشروع في الرياض"},
{i:"hero-2.jpeg",e:"مظلات السيارات",a:"مظلات متينة",b:"بتصاميم عملية",p:"مظلات للمواقف والمساحات الخارجية بهياكل قوية وتغطية كاملة"},
{i:"hero-3.jpeg",e:"السواتر والخصوصية",a:"خصوصية وحماية",b:"بجودة عالية",p:"سواتر بمقاسات وخامات متعددة للمنازل والفلل والاستراحات"},
{i:"hero-4.jpeg",e:"الساندوتش بانل",a:"غرف ومستودعات",b:"بعزل وتركيب سريع",p:"تنفيذ وتركيب الساندوتش بانل للمرافق والمجالس والمنشآت"},
{i:"hero-5.jpeg",e:"الزجاج السيكوريت",a:"زجاج سيكوريت",b:"بتنفيذ احترافي",p:"أبواب وواجهات وفواصل زجاجية بمقاسات دقيقة وتركيب آمن"}
];
let hi=0,ht;
$("#slides").innerHTML=H.map(h=>`<div class="slide"><img src="/assets/${h.i}" alt=""></div>`).join("");
$("#tl").innerHTML=H.map((_,i)=>`<span data-i="${i}"></span>`).join("");
function go(i){
  hi=i;
  $$(".slide").forEach((s,k)=>s.classList.toggle("on",k===i));
  $$("#tl span").forEach((s,k)=>s.classList.toggle("on",k===i));
  const h=H[i],c=$("#hc");
  c.classList.remove("in");void c.offsetWidth;
  c.innerHTML=`<span class="lbl">${h.e}</span><h1>${h.a}<b>${h.b}</b></h1><p>${h.p}</p><div class="row"><a class="btn b-p" href="#contact">اطلب عرض سعر</a><a class="btn b-g" href="tel:0534107471">اتصل بنا</a></div>`;
  c.classList.add("in");
  $("#cnt").textContent=String(i+1).padStart(2,"0");
  clearInterval(ht);ht=setInterval(()=>go((hi+1)%H.length),6000);
}
$("#tl").onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
go(0);
</script>
</body>
</html>
